<!DOCTYPE html>
<html>
<head><title>Add Medicine</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<div class="container">
    <h2>Add Medicine</h2>
    <form method="POST">
        <input name="name" placeholder="Name" required>
        <input name="manufacturer" placeholder="Manufacturer" required>
        <input name="price" type="number" step="0.01" placeholder="Price" required>
        <input name="quantity" type="number" placeholder="Quantity" required>
        <input name="expiry" type="date" required>
        <button>Add</button>
    </form>
    <a href="/">Back</a>
</div>
</body>
</html>
